# Blueprint Render untuk layanan backend SIMPUL DESA.
#
# Pakai lewat Dashboard Render -> New -> Blueprint, tunjuk ke repo ini.
# Lima variabel ber-`sync: false` TIDAK ada di berkas ini dan tidak pernah
# ter-commit: Render menanyakannya sekali saat blueprint dipasang, lalu
# menyimpannya terenkripsi. Langkah lengkap ada di DEPLOY.md.
services:
  - type: web
    name: simpul-desa-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # `free` ikut spin-down setelah menganggur: permintaan pertama sesudahnya
    # menunggu cold start (muat Simpanan ±164 MB). Untuk demo berjuri, naikkan
    # ke `starter` — RAM-nya sama 512 MB, yang hilang hanya spin-down-nya.
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # Di luar `dev`, boot GAGAL bila ORIGIN_APP bukan https, kredensial
      # Supabase kosong, atau WEB_CONCURRENCY > 1 (src/config.py).
      - key: LINGKUNGAN
        value: produksi
      - key: DIR_DATA
        value: data-salinan
      # WAJIB 1 — gerbang "satu pekerjaan penyegaran pada satu waktu" hidup
      # di memori proses (ADR-0010).
      - key: WEB_CONCURRENCY
        value: 1
      - key: CACHE_MAX_AGE
        value: 3600
      - key: LAJU_BAWAAN
        value: 120/minute
      - key: LAJU_CHAT
        value: 10/minute;200/day
      - key: JWT_AUDIENCE
        value: authenticated
      # Tombol MEMORI, bukan kecepatan. Nilai di sini jauh di bawah bawaan
      # pengembangan (16/4/16/16) karena satu entri jalur ekonomi terukur
      # ±103 MB RAM dan satu entri kartu ±13 MB, sementara muat Simpanan
      # saat start sudah ±164 MB. Perhitungannya di DEPLOY.md.
      - key: MAKS_CACHE_KARTU
        value: 4
      - key: MAKS_CACHE_JALUR
        value: 1
      - key: MAKS_CACHE_CITRA
        value: 4
      - key: MAKS_CACHE_KEMBAR
        value: 8
      - key: MODEL_CHAT
        value: gemini-flash-latest
      - key: MODEL_CHAT_CADANGAN
        value: gemini-flash-lite-latest
      - key: CHAT_MAKS_PESAN
        value: 20
      - key: CHAT_MAKS_KARAKTER
        value: 4000
      - key: CHAT_MAKS_PUTARAN_ALAT
        value: 5
      # Diisi saat blueprint dipasang; tidak pernah masuk repo.
      # ORIGIN_APP = URL https dasbor app/ (CORS non-GET + endpoint bertoken).
      - key: ORIGIN_APP
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_CHAT
        sync: false
